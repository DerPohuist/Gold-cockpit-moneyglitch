<script>
(() => {
  let B = JSON.parse(document.getElementById('blob').textContent);
  // GitHub Pages hält die Seite bis zu 10 Minuten im Zwischenspeicher. Deshalb holen wir den neuesten Stand
  // mit einem Zeitstempel an der Adresse direkt vom Server. Klappt das nicht in 4 Sekunden, bleibt der gespeicherte Stand.
  const frisch = async () => {
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4000);
      const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store', signal: ctl.signal })).text();
      clearTimeout(to);
      const m = /<script type="application[/]json" id="blob">([^]*?)<[/]script>/.exec(t);
      if (m) B = JSON.parse(m[1]);
    } catch (e) {}
  };
  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  // Passwort prüfen, indem die Seite entschlüsselt wird; klappt es, ersetzt sie diese Sperrseite
  let geholt = null;
  const open = async (pw) => {
    if (!geholt) geholt = frisch();
    await geholt;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(B.s), iterations: B.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(B.i) }, key, u8(B.c)));
    try { localStorage.setItem('gc-pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  };
  const gate = document.getElementById('gate');
  let saved = null;
  try { saved = localStorage.getItem('gc-pw'); } catch (e) {}
  if (saved) open(saved).catch(() => { try { localStorage.removeItem('gc-pw'); } catch (e) {} gate.hidden = false; });
  else gate.hidden = false;
  document.getElementById('gate-f').addEventListener('submit', (e) => {
    e.preventDefault();
    open(document.getElementById('gate-pw').value.trim()).catch(() => { document.getElementById('gate-err').hidden = false; });
  });
})();
</script>
